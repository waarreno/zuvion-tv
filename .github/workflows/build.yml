name: Build

# Compila a cada push na main/PR e sob demanda (testes em branches dev/*).
# Quando os secrets existem, o APK de teste sai assinado com a mesma chave dos Releases,
# então pode ser instalado por cima do app (mantendo login e favoritos) para testar no aparelho.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar chave de assinatura (se disponível)
        env:
          KS: ${{ secrets.ZUVION_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/zuvion.p12"
            echo "ZUVION_KEYSTORE_PATH=$RUNNER_TEMP/zuvion.p12" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          ZUVION_KEYSTORE_PASSWORD: ${{ secrets.ZUVION_KEYSTORE_PASSWORD }}
          ZUVION_KEY_ALIAS: ${{ secrets.ZUVION_KEY_ALIAS }}
          ZUVION_KEY_PASSWORD: ${{ secrets.ZUVION_KEY_PASSWORD }}
          ZUVION_TMDB_KEY: ${{ secrets.ZUVION_TMDB_KEY }}
          ZUVION_INTRODB_KEY: ${{ secrets.ZUVION_INTRODB_KEY }}
        run: |
          # Versão de teste: um número acima da última tag, para instalar por cima.
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo v1.0.0)
          V="${LAST#v}"; IFS=. read -r A B C <<< "$V"; TV="$A.$B.$((C+1))"
          gradle :app:assembleRelease -PversionName="$TV" -PgithubRepo="$GITHUB_REPOSITORY" --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zuvion-tv-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
