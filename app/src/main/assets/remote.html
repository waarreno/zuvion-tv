<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060814">
<title>Zuvion TV · Celular</title>
<style>
  :root { --bg:#060814; --text:#F4F5FF; --muted:#BDC1E3; --violet:#B9AEFF; --live:#FF4D63; --ok:#5BE3A4; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(60% 40% at 90% 0%, rgba(124,96,255,.55), transparent 70%),
                radial-gradient(50% 40% at 0% 100%, rgba(38,196,228,.28), transparent 70%), var(--bg);
    padding: 24px 16px 40px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header b { font-size: 22px; } header b span { color: var(--violet); }
  header small { display: block; color: var(--muted); font-size: 13px; }
  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.22); border-radius: 26px; padding: 20px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .tabs, .types { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: var(--text);
    border-radius: 999px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .chip.on { background: #F4F5FF; color: #0B0D1F; }
  label { display: block; color: var(--muted); font-size: 13px; margin: 12px 0 6px; }
  input {
    width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06); color: var(--text); font: inherit; outline: none;
  }
  input:focus { border-color: var(--violet); }
  button.primary {
    width: 100%; margin-top: 20px; padding: 15px; border-radius: 999px; border: 0;
    background: #F4F5FF; color: #0B0D1F; font: inherit; font-weight: 700; cursor: pointer;
  }
  .msg { margin-top: 14px; min-height: 22px; font-size: 14px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--live); }
  .hide { display: none; }
  p.note { color: var(--muted); font-size: 13px; margin: 16px 4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9AEFF"/><stop offset="1" stop-color="#5BD8EE"/></linearGradient></defs>
      <circle cx="22" cy="22" r="11" fill="url(#g)"/>
      <ellipse cx="22" cy="22" rx="19.8" ry="7" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" transform="rotate(-24 22 22)"/>
      <circle cx="39" cy="14" r="2.4" fill="#fff"/>
    </svg>
    <div><b>Zuvion <span>TV</span></b><small>Digite aqui, aparece na TV</small></div>
  </header>

  <div class="tabs">
    <button class="chip" data-tab="login">Adicionar lista</button>
    <button class="chip" data-tab="search">Buscar</button>
  </div>

  <section id="login" class="glass hide">
    <div class="types">
      <button class="chip" data-type="XTREAM">Xtream</button>
      <button class="chip" data-type="M3U_URL">M3U</button>
      <button class="chip" data-type="STALKER">MAC</button>
    </div>
    <label for="name">Nome da lista</label><input id="name" placeholder="Ex.: Minha TV" autocomplete="off">
    <div data-for="XTREAM M3U_URL STALKER"><label for="url" id="urlLabel">Servidor (URL)</label><input id="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="http://servidor:porta"></div>
    <div data-for="XTREAM"><label for="user">Usuário</label><input id="user" autocapitalize="off" autocomplete="off"></div>
    <div data-for="XTREAM"><label for="pass">Senha</label><input id="pass" type="password" autocomplete="off"></div>
    <div data-for="STALKER"><label for="mac">Endereço MAC (vazio = usar o da TV)</label><input id="mac" autocapitalize="characters" placeholder="00:1A:79:XX:XX:XX"></div>
    <div data-for="M3U_URL"><label for="epg">URL do EPG (opcional)</label><input id="epg" inputmode="url" autocapitalize="off"></div>
    <button class="primary" id="send">Enviar para a TV e entrar</button>
    <div class="msg" id="loginMsg"></div>
  </section>

  <section id="search" class="glass hide">
    <label for="q">Canal, filme ou série</label>
    <input id="q" placeholder="Digite para buscar na TV" autocomplete="off" enterkeyhint="search">
    <button class="primary" id="go">Buscar na TV</button>
    <div class="msg" id="searchMsg"></div>
  </section>

  <p class="note">O celular e a TV precisam estar na mesma rede Wi-Fi. Os dados vão direto para a TV, sem passar pela internet.</p>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  let type = 'XTREAM';
  const $ = id => document.getElementById(id);

  function showTab(t) {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    ['login', 'search'].forEach(s => $(s).classList.toggle('hide', s !== t));
    (t === 'search' ? $('q') : $('url')).focus();
  }
  function setType(t) {
    type = t;
    document.querySelectorAll('[data-type]').forEach(b => b.classList.toggle('on', b.dataset.type === t));
    document.querySelectorAll('[data-for]').forEach(d => d.classList.toggle('hide', !d.dataset.for.split(' ').includes(t)));
    $('urlLabel').textContent = t === 'M3U_URL' ? 'URL da lista M3U' : t === 'STALKER' ? 'URL do portal' : 'Servidor (URL)';
  }
  async function post(path, body) {
    const r = await fetch(path + '?t=' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text());
  }
  function msg(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => setType(b.dataset.type));

  $('send').onclick = async () => {
    const f = { type, name: $('name').value, url: $('url').value, user: $('user').value, pass: $('pass').value, mac: $('mac').value, epg: $('epg').value };
    if (!f.url.trim()) return msg($('loginMsg'), 'Informe o endereço.', false);
    if (type === 'XTREAM' && (!f.user.trim() || !f.pass.trim())) return msg($('loginMsg'), 'Informe usuário e senha.', false);
    try { await post('/login', f); msg($('loginMsg'), 'Enviado! Confira a TV.', true); }
    catch (e) { msg($('loginMsg'), 'Não foi possível enviar: ' + e.message, false); }
  };

  let timer;
  $('q').oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(() => post('/search', { text: $('q').value, final: 'false' }).catch(() => {}), 250);
  };
  const search = async () => {
    try { await post('/search', { text: $('q').value, final: 'true' }); msg($('searchMsg'), 'Buscando na TV…', true); }
    catch (e) { msg($('searchMsg'), 'Não foi possível enviar: ' + e.message, false); }
  };
  $('go').onclick = search;
  $('q').onkeydown = e => { if (e.key === 'Enter') search(); };

  setType('XTREAM');
  showTab(params.get('m') === 'search' ? 'search' : 'login');
</script>
</body>
</html>
